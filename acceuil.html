<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Page De Connexion</title>
</head>
<body>
    <a href="index.html">Deuxieme Page</a>
    <form action="">
        <h1>Connexion du recruteur</h1>
        <div class="input_box">
            <input type="text" name="Recruteur_Nom" id="Recruteur_Nom" placeholder="Votre Nom" required>
        </div class="input_box">
        <div class="input_box">
            <input type="email" name="Recruteur_Email" id="Recruteur_Email" placeholder="Votre email" required>
        </div>
        <div class="input_box">
            <input type="password" name="Recruteur_Mdp" id="Recruteur_Mdp" placeholder="votre mot de passe" required>
        </div>
        <div class="input_box">
            <button id="save_btn" type="submit">Connexion</button>
        </div>
    </form>
</body>
</html>
